name: Refresh Unified Agenda data

on:
  # Run automatically once a day at 12:00 UTC (5:30 PM IST / 8 AM ET).
  schedule:
    - cron: '0 12 * * *'
  # Allow manual triggering from the GitHub Actions tab for testing.
  workflow_dispatch:

# Give the workflow permission to push commits back to the repo.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run the fetch script
        run: python fetch_all_agendas.py

      - name: Commit and push if data changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/agenda_history.json
          if git diff --staged --quiet; then
            echo "No changes to commit — data is identical to last run."
          else
            git commit -m "Refresh Unified Agenda data ($(date -u +'%Y-%m-%d'))"
            git push
          fi